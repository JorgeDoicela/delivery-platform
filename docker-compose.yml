# ==============================================================================
# Delivery Platform (Mesafy) - Manifiesto Canónico de Docker Compose
# ÚNICA FUENTE DE LA VERDAD PARA ORQUESTACIÓN (Desarrollo y Producción)
# ==============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - delivery_postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - delivery-network

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Definir REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - delivery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - delivery-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-${IMAGE_REGISTRY_PREFIX:-ghcr.io/jorgedoicela/delivery-platform}/delivery-backend:latest}
    container_name: delivery-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5005
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-delivery};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?Definir REDIS_PASSWORD en .env}
      - Jwt__SecretKey=${JWT_SECRET:?Definir JWT_SECRET en .env}
      - Jwt__Issuer=${JWT_ISSUER:-DeliveryPlatform.Api}
      - Jwt__Audience=${JWT_AUDIENCE:-DeliveryPlatform.Clients}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?Definir INITIAL_ADMIN_PASSWORD en .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-5005}:5005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - delivery-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://demotiles.maplibre.org/style.json}
        NEXT_PUBLIC_PLATFORM_DOMAIN: ${NEXT_PUBLIC_PLATFORM_DOMAIN:-mesafy.doicela.dev}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    image: ${FRONTEND_IMAGE:-${IMAGE_REGISTRY_PREFIX:-ghcr.io/jorgedoicela/delivery-platform}/delivery-frontend:latest}
    container_name: delivery-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:5005}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
      - NEXT_PUBLIC_MAP_STYLE_URL=${NEXT_PUBLIC_MAP_STYLE_URL:-https://demotiles.maplibre.org/style.json}
      - NEXT_PUBLIC_PLATFORM_DOMAIN=${NEXT_PUBLIC_PLATFORM_DOMAIN:-mesafy.doicela.dev}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${PORT:-3005}:3005"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3005/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - delivery-network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ${NGINX_IMAGE:-${IMAGE_REGISTRY_PREFIX:-ghcr.io/jorgedoicela/delivery-platform}/delivery-nginx:latest}
    container_name: delivery-nginx
    restart: unless-stopped
    environment:
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-${NEXT_PUBLIC_PLATFORM_DOMAIN:-mesafy.doicela.dev}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - delivery-network

volumes:
  delivery_postgres_data:
    name: delivery_postgres_data
  delivery_redis_data:
    name: delivery_redis_data

networks:
  delivery-network:
    name: delivery-network
    driver: bridge
