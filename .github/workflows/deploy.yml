name: CD Pipeline (Despliegue Automatico y Rollback)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Servicio especifico a desplegar'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'all'
          - 'backend'
          - 'frontend'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Validacion Pre-Despliegue
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.calc_target.outputs.deploy_target }}
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Filtro de rutas modificadas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose*.yml'
              - '.dockerignore'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Determinar target de despliegue
        id: calc_target
        run: |
          MANUAL_TARGET="${{ github.event.inputs.target }}"
          if [ -n "$MANUAL_TARGET" ] && [ "$MANUAL_TARGET" != "auto" ]; then
            echo "deploy_target=$MANUAL_TARGET" >> "$GITHUB_OUTPUT"
            echo "Target seleccionado manualmente: $MANUAL_TARGET"
            exit 0
          fi

          BACKEND="${{ steps.filter.outputs.backend }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          INFRA="${{ steps.filter.outputs.infra }}"

          if [ "$INFRA" = "true" ] || ( [ "$BACKEND" = "true" ] && [ "$FRONTEND" = "true" ] ); then
            TARGET="all"
          elif [ "$BACKEND" = "true" ]; then
            TARGET="backend"
          elif [ "$FRONTEND" = "true" ]; then
            TARGET="frontend"
          else
            TARGET="all"
          fi

          echo "deploy_target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target automatico calculado: $TARGET"

  build-and-push-images:
    name: Compilacion y Publicacion en GHCR
    needs: pre-deploy-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar prefijo de imagen en minusculas
        id: meta
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${LOWER_REPO}" >> "$GITHUB_OUTPUT"

      - name: Compilar y publicar Backend (.NET 8)
        if: ${{ needs.pre-deploy-validation.outputs.deploy_target == 'all' || needs.pre-deploy-validation.outputs.deploy_target == 'backend' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/delivery-backend:latest
            ${{ steps.meta.outputs.prefix }}/delivery-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compilar y publicar Frontend (Next.js 16)
        if: ${{ needs.pre-deploy-validation.outputs.deploy_target == 'all' || needs.pre-deploy-validation.outputs.deploy_target == 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_WS_URL=
            NEXT_PUBLIC_PLATFORM_DOMAIN=${{ vars.PLATFORM_DOMAIN || 'mesafy.doicela.dev' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/delivery-frontend:latest
            ${{ steps.meta.outputs.prefix }}/delivery-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compilar y publicar Nginx Perimetral
        if: ${{ needs.pre-deploy-validation.outputs.deploy_target == 'all' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/delivery-nginx:latest
            ${{ steps.meta.outputs.prefix }}/delivery-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Despliegue en Servidor de Produccion
    needs: [pre-deploy-validation, build-and-push-images]
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue remoto via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            TARGET="${{ needs.pre-deploy-validation.outputs.deploy_target }}"

            echo "[CI/CD] Verificando instalacion de repositorio en ${DEPLOY_DIR}..."
            if [ ! -d "${DEPLOY_DIR}/.git" ]; then
              echo "[CI/CD] Clonando repositorio en servidor de destino..."
              mkdir -p "${DEPLOY_DIR}"
              git clone "https://github.com/${{ github.repository }}.git" "${DEPLOY_DIR}"
            fi

            cd "${DEPLOY_DIR}"
            test -f .env || cp .env.example .env

            echo "[CI/CD] Autenticando Docker con GitHub Container Registry..."
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            echo "[CI/CD] Actualizando manifiestos y scripts desde origin/main..."
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main

            echo "[CI/CD] Otorgando permisos de ejecucion a scripts de despliegue..."
            chmod +x scripts/deploy/*.sh

            echo "[CI/CD] Ejecutando script de despliegue con target: ${TARGET}..."
            ./scripts/deploy/deploy.sh "${TARGET}"
