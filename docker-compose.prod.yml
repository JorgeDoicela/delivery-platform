services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en produccion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - delivery_postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/db/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - delivery-prod-network

  redis:
    image: redis:7-alpine
    container_name: delivery-redis-prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Definir REDIS_PASSWORD en produccion}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - delivery_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - delivery-prod-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: delivery-backend:latest
    container_name: delivery-backend-prod
    restart: always
    ports:
      - "${API_PORT:-5005}:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5005
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-delivery};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - delivery-prod-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5005}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:5005/hubs}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://demotiles.maplibre.org/style.json}
    image: delivery-frontend:latest
    container_name: delivery-frontend-prod
    restart: always
    ports:
      - "${PORT:-3005}:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3005/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - delivery-prod-network

volumes:
  delivery_postgres_prod_data:
    name: delivery_postgres_prod_data
  delivery_redis_prod_data:
    name: delivery_redis_prod_data

networks:
  delivery-prod-network:
    name: delivery-prod-network
    driver: bridge
